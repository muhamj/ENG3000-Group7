  :root{
    --maze-blue: #2121de;
    --maze-blue-lt: #4d4dff;
    --blue-lt: #6e96ff;
    --blue-deep: #2838d2;
    --cab-black: #000000;
    --cab-panel: #050505;
    --wood: #08080c;
    --wood-lt: #0c0c12;
    --wood-dk: #000000;
    --screen-bg: #000000;
    --mound: #5c3f27;
    --hole: #060403;
    --amber: #ffff00;
    --cream: #ffe05a;
    --bulb-off: #1e1e1e;
    --pac-yellow: #ffff00;
    --red-led: #ff0000;
    --dot: #ffb897;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: radial-gradient(ellipse at 50% 0%, #0a0a12 0%, #000 65%);
    display:flex; align-items:center; justify-content:center;
    font-family:'LEDMono', monospace;
    color:var(--cream);
    padding:20px 0;
  }

  body::before{
    content:'';
    position:fixed; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .cabinet{
    width:min(520px, 95vw);
    background: var(--wood);
    border-radius:8px;
    padding:14px;
    position:relative;
    box-shadow: 0 30px 70px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.5);
  }

  .bolt{ position:absolute; width:12px; height:12px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #8a8f94, #55585c 55%, #303236 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .bolt.tl{ top:8px; left:8px; } .bolt.tr{ top:8px; right:8px; }
  .bolt.bl{ bottom:8px; left:8px; } .bolt.br{ bottom:8px; right:8px; }

  .bezel{
    background: linear-gradient(160deg, #8a8f94, #55585c 40%, #303236);
    border-radius:10px;
    padding:9px;
  }
  .field{
    position:relative;
    background: var(--screen-bg);
    border-radius:4px;
    padding:14px;
    box-shadow: inset 0 0 40px rgba(0,0,0,.85), inset 0 0 0 2px #000;
    overflow:hidden;
  }
  .field::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:30;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
    mix-blend-mode:multiply;
  }
  .field::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:31;
    box-shadow: inset 0 0 60px 14px rgba(0,0,0,.75);
  }

  /* ============== SHARED 3x3 GRID (both menu and gameplay use this exact footprint) ============== */
  .grid3{
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:10px; aspect-ratio:1/1; position:relative; z-index:1;
  }

  /* ============== MENU LAYER ============== */
  #menuLayer.hidden{ display:none; }

  .menu-title-cell{
    grid-column:1/4; grid-row:1;
    background:#050505; border:3px solid var(--maze-blue); border-radius:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6px; position:relative; overflow:visible;
  }
  .menu-title-cell img{ width:min(260px,80%); filter:drop-shadow(0 3px 4px rgba(0,0,0,.6)); position:relative; z-index:1; }

  .menu-diff-cell{
    position:relative; border-radius:6px; background:#050505;
    display:flex; align-items:center; justify-content:center;
    font-family:'PixelArcade',monospace; font-size:clamp(9px,2.6vw,13px);
    overflow:visible; user-select:none;
  }
  .menu-diff-cell[data-diff="Easy"]{ border:3px solid var(--blue-lt); color:var(--blue-lt); }
  .menu-diff-cell[data-diff="Medium"]{ border:3px solid var(--amber); color:var(--amber); }
  .menu-diff-cell[data-diff="Hard"]{ border:3px solid var(--blue-deep); color:var(--blue-deep); }

  /* Perimeter light dots — walk the actual rectangle border (not a circle),
     shared by the title cell (always chasing) and the difficulty cells
     (chasing only while the hammer is hovering / charging). */
  .perim-dot{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:var(--amber); opacity:.12; pointer-events:none;
    transform:translate(-50%,-50%); z-index:2;
  }
  .menu-title-cell .perim-dot{ animation: perimChase 1.8s linear infinite; }
  .menu-diff-cell .perim-dot{ animation: perimChase 1.8s linear infinite; animation-play-state:paused; opacity:.1; }
  .menu-diff-cell.charging .perim-dot{ animation-play-state:running; }
  @keyframes perimChase{
    0%,100%{ opacity:.12; box-shadow:none; }
    50%{ opacity:1; box-shadow:0 0 6px 2px rgba(255,255,0,.9); }
  }
  .menu-diff-cell.charging{ box-shadow:0 0 16px rgba(255,255,0,.35); }

  .menu-blank-cell{
    border:3px solid var(--maze-blue); border-radius:6px; background:#050505;
    display:flex; align-items:center; justify-content:center;
  }
  .menu-blank-cell .dot{ width:6px; height:6px; border-radius:50%; background:var(--dot); opacity:.5; }

  .menu-help-cell{
    position:relative; border:3px solid var(--maze-blue); border-radius:6px; background:#050505;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:help; color:var(--cream);
    font-family:'PixelArcade',monospace;
  }
  .menu-help-cell .q-mark{ font-size:clamp(16px,4.4vw,22px); line-height:1; }
  .menu-help-cell .help-label{ font-size:clamp(7px,2vw,9px); letter-spacing:.05em; }
  .menu-help-cell:hover{ border-color:var(--amber); color:var(--amber); box-shadow:0 0 14px rgba(255,255,0,.3); }

  .help-tooltip{
    position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%) translateY(4px);
    width:min(320px, 90vw);
    background:#050505; border:2px solid var(--amber); border-radius:6px;
    padding:12px 14px; z-index:50;
    opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity .12s ease, transform .12s ease;
    font-family:'LEDMono',monospace; font-size:14px; line-height:1.4; color:var(--cream);
    text-align:left;
  }
  .help-tooltip::after{
    content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--amber);
  }
  .menu-help-cell:hover .help-tooltip{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
  .help-tooltip h4{ margin:0 0 6px; font-family:'PixelArcade',monospace; font-size:9px; color:var(--amber); }
  .help-tooltip li{ margin-bottom:4px; }

  /* ============== GAMEPLAY LAYER (the mole grid) ============== */
  #gameLayer.hidden{ display:none; }

  .cell{ position:relative; overflow:visible; }
  .cell-svg{ width:100%; height:100%; display:block; overflow:visible; }
  .mole-inner{ transform: translateY(46px); transition: transform .12s cubic-bezier(.34,1.56,.64,1); }
  .mole.up .mole-inner{ transform: translateY(-30px); }
  .mole.hit .mole-inner{ transform: translateY(-6px); filter: brightness(1.6) saturate(1.3); }

  .hit-burst{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'PixelArcade',monospace; color:var(--amber);
    font-size:0; opacity:0; pointer-events:none; z-index:5;
    text-shadow:0 0 6px rgba(255,255,0,.9);
  }
  .hit-burst.show{ font-size:11px; opacity:1; animation: floatUp .55s ease-out forwards; }
  @keyframes floatUp{ 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-26px);} }

  .reticle{
    position:absolute; width:42px; height:42px;
    pointer-events:none; transform:translate(-50%,-50%);
    z-index:6; display:none;
  }
  .reticle svg{
    width:100%; height:100%; overflow:visible;
    transform: rotate(-32deg);
    transition: transform .05s linear;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  /* Wind-up: while dwelling on a menu option, the hammer gradually rotates
     further back over the full 2s dwell (transition duration matches the
     dwell time so it reads as "charging up" rather than snapping). */
  .reticle.charging svg{
    transition: transform 2s linear;
    transform: rotate(-95deg);
  }
  .reticle.swing svg{ animation: hammerSwing .22s ease-out; }
  @keyframes hammerSwing{ 0%{transform:rotate(-32deg);} 45%{transform:rotate(34deg);} 100%{transform:rotate(-32deg);} }
  .reticle.swing-charged svg{ animation: hammerSwingCharged .26s ease-out; }
  @keyframes hammerSwingCharged{ 0%{transform:rotate(-95deg);} 40%{transform:rotate(42deg);} 100%{transform:rotate(-32deg);} }

  .back-to-menu{
    position:absolute; top:6px; right:6px; z-index:20;
    font-family:'PixelArcade',monospace; font-size:7px; color:var(--cream);
    background:#050505; border:1px solid var(--maze-blue); border-radius:4px;
    padding:4px 6px; cursor:pointer;
  }
  .back-to-menu:hover{ border-color:var(--amber); color:var(--amber); }
</style>
</head>
<body>

<div class="cabinet">
  <div class="bolt tl"></div><div class="bolt tr"></div><div class="bolt bl"></div><div class="bolt br"></div>

  <div class="bezel">
    <div class="field" id="field">

  <rect x="20" y="14" width="12" height="30" rx="3" fill="#120c06"/>
  <rect x="22" y="16" width="8" height="26" rx="2" fill="#b07a40"/>
  <rect x="23" y="18" width="3" height="16" fill="#ce9858"/>
  <rect x="6" y="2" width="40" height="18" rx="5" fill="#120c06"/>
  <rect class="hammer-head" x="9" y="5" width="34" height="12" rx="4" fill="#b6bac0"/>
  <rect x="12" y="7" width="14" height="5" rx="2" fill="#d6dadf"/>
</svg>`;

// Walks the TRUE rectangular perimeter of `el` (not a circle) and drops
// `count` small light dots evenly along it — used for both the title
// banner (always chasing) and the difficulty boxes (chasing while charging).
function buildPerimeterDots(el, count){
  const w = el.clientWidth, h = el.clientHeight;
  const perimeter = 2*(w+h);
  for(let i=0;i<count;i++){
    const dist = (i/count) * perimeter;
    let x, y;
    if(dist < w){ x = dist; y = 0; }
    else if(dist < w+h){ x = w; y = dist - w; }
    else if(dist < 2*w+h){ x = w - (dist - (w+h)); y = h; }
    else { x = 0; y = h - (dist - (2*w+h)); }
    const dot = document.createElement('div');
    dot.className = 'perim-dot';
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
    dot.style.animationDelay = (i * (1.8/count)) + 's';
    el.appendChild(dot);
  }
}

function initPerimeterLights(){
  document.querySelectorAll('.perim-dot').forEach(d => d.remove());
  buildPerimeterDots(titleCell, 28);
  document.querySelectorAll('.menu-diff-cell').forEach(cell => buildPerimeterDots(cell, 20));
}
window.addEventListener('load', initPerimeterLights);
window.addEventListener('resize', initPerimeterLights);

const DIFFICULTY_PRESETS = {
  Easy:   { spawnMs: 1500, upMs: 2000 },
  Medium: { spawnMs: 1150, upMs: 1500 },
  Hard:   { spawnMs: 900,  upMs: 1100 },
};

let cells = [];
let moleTimer = null;
let running = false;

function moleShapeMarkup(){
  return `
    <path d="M22 78 Q22 34 50 28 Q78 34 78 78 Z" fill="#0a0704"/>
    <path d="M25 76 Q25 37 50 32 Q75 37 75 76 Z" fill="#a86e3a"/>
    <circle cx="34" cy="38" r="7" fill="#a86e3a" stroke="#0a0704" stroke-width="2"/>
    <circle cx="66" cy="38" r="7" fill="#a86e3a" stroke="#0a0704" stroke-width="2"/>
    <circle cx="39" cy="50" r="7" fill="#fff"/>
    <circle cx="61" cy="50" r="7" fill="#fff"/>
    <circle cx="41" cy="52" r="3.4" fill="#141008"/>
    <circle cx="63" cy="52" r="3.4" fill="#141008"/>
  `;
}

function buildGameGrid(){
  gameLayer.querySelectorAll('.cell').forEach(c=>c.remove());
  cells = [];
  for(let i=0;i<9;i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `
      <svg class="cell-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
        <defs><clipPath id="holeClip${i}"><rect x="0" y="0" width="100" height="47"/></clipPath></defs>
        <rect x="5" y="46" width="90" height="48" rx="20" fill="#3d2917"/>
        <rect x="10" y="48" width="80" height="36" rx="16" fill="#5c3f27"/>
        <ellipse cx="50" cy="50" rx="27" ry="11" fill="#060403"/>
        <ellipse cx="50" cy="50" rx="27" ry="11" fill="none" stroke="#2121de" stroke-width="1.2"/>
        <g class="mole" data-idx="${i}">
          <g class="mole-clip" clip-path="url(#holeClip${i})">
            <g class="mole-inner">${moleShapeMarkup()}</g>
          </g>
        </g>
      </svg>
      <div class="hit-burst">+10</div>
    `;
    gameLayer.appendChild(cell);
    cells.push({el:cell, mole:cell.querySelector('.mole'), burst:cell.querySelector('.hit-burst'), up:false, hit:false});
  }
}
buildGameGrid();

function popRandomMole(difficulty){
  const idle = cells.filter(c => !c.up);
  if(idle.length === 0) return;
  const c = idle[Math.floor(Math.random()*idle.length)];
  c.up = true; c.hit = false;
  c.mole.classList.add('up');
  setTimeout(() => {
    if(c.up && !c.hit){ c.up = false; c.mole.classList.remove('up'); }
  }, DIFFICULTY_PRESETS[difficulty].upMs);
}

function checkHit(x, y){
  cells.forEach(c => {
    if(!c.up || c.hit) return;
    const rect = c.el.getBoundingClientRect();
    if(x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom){
      c.hit = true;
      c.mole.classList.add('hit');
      c.burst.classList.add('show');
      reticle.classList.remove('swing'); void reticle.offsetWidth; reticle.classList.add('swing');
      setTimeout(() => {
        c.up = false; c.mole.classList.remove('up','hit');
        c.burst.classList.remove('show');
      }, 260);
    }
  });
}

field.addEventListener('mousemove', (e) => {
  reticle.style.display = 'block';
  const rect = field.getBoundingClientRect();
  reticle.style.left = (e.clientX - rect.left) + 'px';
  reticle.style.top = (e.clientY - rect.top) + 'px';
  if(running) checkHit(e.clientX, e.clientY);
});
field.addEventListener('mouseleave', () => { reticle.style.display = 'none'; });

const DWELL_MS = 2000;

// ---- Hover-and-dwell difficulty selection (no clicking) ----
// Hovering a box for DWELL_MS winds the hammer back; if you stay the full
// duration it swings down and hits — that's what actually starts the game.
// Leaving early cancels the wind-up.
document.querySelectorAll('.menu-diff-cell').forEach(cell => {
  let dwellTimeout = null;

  cell.addEventListener('mouseenter', () => {
    cell.classList.add('charging');
    reticle.classList.add('charging');
    dwellTimeout = setTimeout(() => {
      cell.classList.remove('charging');
      reticle.classList.remove('charging');
      reticle.classList.remove('swing'); void reticle.offsetWidth;
      reticle.classList.add('swing-charged');
      startGame(cell.dataset.diff);
    }, DWELL_MS);
  });

  cell.addEventListener('mouseleave', () => {
    clearTimeout(dwellTimeout);
    cell.classList.remove('charging');
    reticle.classList.remove('charging');
  });
});

function startGame(difficulty){
  menuLayer.classList.add('hidden');
  gameLayer.classList.remove('hidden');
  running = true;
  cells.forEach(c => { c.up=false; c.hit=false; c.mole.classList.remove('up','hit'); });
  clearInterval(moleTimer);
  moleTimer = setInterval(() => popRandomMole(difficulty), DIFFICULTY_PRESETS[difficulty].spawnMs);
}

function backToMenuFn(){
  running = false;
  clearInterval(moleTimer);
  gameLayer.classList.add('hidden');
  menuLayer.classList.remove('hidden');
}

backToMenu.addEventListener('click', backToMenuFn);
</script>
